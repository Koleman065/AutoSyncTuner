name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/AutoSyncTuner.apk

      - name: Upload APK (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: AutoSyncTuner-apk
          path: out/AutoSyncTuner.apk

      # Publishes the newest build on the repo's Releases page so you can
      # download it straight from your phone's browser.
      - name: Publish "latest" release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/AutoSyncTuner.apk \
            --title "Latest build ($(git rev-parse --short HEAD))" \
            --notes "Built automatically from the latest commit. Open on your phone and tap AutoSyncTuner.apk to install." \
            --latest

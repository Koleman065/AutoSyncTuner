name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Shared tests (JVM)
        run: ./gradlew --no-daemon :shared:testDebugUnitTest

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_B64 not set; APK will be signed with a throwaway debug key"
          fi

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon :androidApp:assembleRelease
          mkdir -p out
          cp androidApp/build/outputs/apk/release/androidApp-release.apk out/AutoSyncTuner.apk
          # Read by the app's "Check for updates".
          VERSION_NAME=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          printf '{"versionCode": %s, "versionName": "%s", "apkUrl": "https://github.com/%s/releases/download/latest/AutoSyncTuner.apk"}\n' \
            "$BUILD_NUMBER" "$VERSION_NAME" "$GITHUB_REPOSITORY" > out/version.json
          cat out/version.json

      - uses: actions/upload-artifact@v4
        with:
          name: AutoSyncTuner-apk
          path: out/

      # Newest build on the Releases page, so it can be installed from a phone browser.
      - name: Publish "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/AutoSyncTuner.apk out/version.json \
            --title "Latest build #${{ github.run_number }} ($(git rev-parse --short HEAD))" \
            --notes "Android: open on your phone and tap AutoSyncTuner.apk. iPhone: install through TestFlight." \
            --latest

  ios:
    runs-on: macos-15
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      # App Store Connect requires apps built with the iOS 26 SDK (Xcode 26+).
      - name: Select Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts') }}

      - name: Shared tests (iOS simulator)
        run: ./gradlew --no-daemon :shared:iosSimulatorArm64Test

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd iosApp && DEVELOPMENT_TEAM="$APPLE_TEAM_ID" xcodegen generate

      - name: Build for simulator (compile check)
        if: env.ASC_KEY_ID == '' || github.ref != 'refs/heads/main'
        run: |
          xcodebuild -project iosApp/AutoSyncTuner.xcodeproj -scheme AutoSyncTuner \
            -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build | tail -n 60
          exit ${PIPESTATUS[0]}

      - name: Archive and upload to TestFlight
        if: env.ASC_KEY_ID != '' && github.ref == 'refs/heads/main'
        run: |
          # Pasted IDs sometimes pick up stray spaces or line breaks.
          ASC_KEY_ID=$(printf '%s' "$ASC_KEY_ID" | tr -d ' \r\n\t')
          ASC_ISSUER_ID=$(printf '%s' "$ASC_ISSUER_ID" | tr -d ' \r\n\t')
          APPLE_TEAM_ID=$(printf '%s' "$APPLE_TEAM_ID" | tr -d ' \r\n\t')
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          # Rebuild the .p8 from whatever was pasted into the secret: the whole file,
          # the file with line breaks lost or turned into spaces, Windows line endings,
          # just the key body, or the file base64-encoded.
          RAW=$(printf '%s' "$ASC_KEY_P8" | tr -d '\r')
          if ! printf '%s' "$RAW" | grep -q 'PRIVATE KEY'; then
            DECODED=$(printf '%s' "$RAW" | tr -d ' \n\t' | base64 -D 2>/dev/null || true)
            if printf '%s' "$DECODED" | grep -q 'PRIVATE KEY'; then RAW="$DECODED"; fi
          fi
          BODY=$(printf '%s' "$RAW" | sed -e 's/-----BEGIN [A-Z ]*-----//g' -e 's/-----END [A-Z ]*-----//g' | tr -d ' \n\t\r')
          if ! printf '%s' "$BODY" | base64 -D >/dev/null 2>&1 || [ ${#BODY} -lt 100 ]; then
            echo "::error::ASC_KEY_P8 doesn't contain a valid App Store Connect key (key body is ${#BODY} characters; a .p8 key body is about 200). Paste the full contents of the AuthKey_XXXX.p8 file."
            exit 1
          fi
          { echo "-----BEGIN PRIVATE KEY-----"; printf '%s' "$BODY" | fold -w 64; echo; echo "-----END PRIVATE KEY-----"; } > "$KEY"
          echo "API key file rebuilt (${#BODY}-character key body, key ID length ${#ASC_KEY_ID}, issuer ID length ${#ASC_ISSUER_ID})"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          sed -i '' "s/TEAM_ID_PLACEHOLDER/$APPLE_TEAM_ID/" iosApp/ExportOptions.plist

          xcodebuild -project iosApp/AutoSyncTuner.xcodeproj -scheme AutoSyncTuner \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/AutoSyncTuner.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive | tail -n 60
          [ "${PIPESTATUS[0]}" = 0 ] || exit 1

          # The archive is built unsigned; the export signs it for the App Store
          # (Apple creates the distribution certificate/profile through the API key).
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/AutoSyncTuner.xcarchive" \
            -exportOptionsPlist iosApp/ExportOptions.plist -exportPath "$RUNNER_TEMP/export" \
            "${AUTH[@]}" | tail -n 40
          exit ${PIPESTATUS[0]}

  # After the iPhone build reaches TestFlight: wait for Apple to process it, add it to
  # every external tester group (public link included) and submit it for beta review.
  testflight-distribute:
    needs: ios
    if: github.ref == 'refs/heads/main' && needs.ios.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyjwt cryptography
      - name: Distribute to external testers
        run: |
          VERSION_NAME=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          SUBJECT=$(git log -1 --format=%s | sed -E 's/ \(#[0-9]+\)$//')
          python .github/scripts/testflight_distribute.py \
            --bundle-id com.edk.autosynctuner \
            --build "${{ github.run_number }}" \
            --notes "Version $VERSION_NAME: $SUBJECT. Try changes in demo mode or on a vehicle where they're harmless, and report anything that looks wrong."
